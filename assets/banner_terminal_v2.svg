<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Santiago Aldana — Cloud and DevOps Engineer</title>
  <desc id="desc">Animated terminal-style GitHub banner showing Santiago Aldana's Cloud, DevOps, AWS, infrastructure as code, CI/CD and AI automation profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080d17"/><stop offset="0.55" stop-color="#0b1424"/><stop offset="1" stop-color="#07101a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f81f7"/><stop offset="1" stop-color="#43d9ff"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101d30"/><stop offset="1" stop-color="#0a1220"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1b3350" stroke-width=".7" opacity=".42"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="line1"><rect x="28" y="88" width="0" height="22"><animate attributeName="width" values="0;0;570;570" keyTimes="0;.03;.15;1" dur="15s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="line2"><rect x="28" y="119" width="0" height="22"><animate attributeName="width" values="0;0;590;590" keyTimes="0;.16;.28;1" dur="15s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="line3"><rect x="28" y="150" width="0" height="22"><animate attributeName="width" values="0;0;650;650" keyTimes="0;.29;.42;1" dur="15s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="line4"><rect x="28" y="181" width="0" height="22"><animate attributeName="width" values="0;0;620;620" keyTimes="0;.43;.57;1" dur="15s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="line5"><rect x="28" y="212" width="0" height="22"><animate attributeName="width" values="0;0;620;620" keyTimes="0;.58;.72;1" dur="15s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <!-- Outer shell -->
  <rect x="1" y="1" width="998" height="298" rx="15" fill="url(#bg)" stroke="#28405c" stroke-width="1.5"/>
  <rect x="2" y="2" width="996" height="296" rx="14" fill="url(#grid)" opacity=".64"/>
  <rect x="2" y="2" width="996" height="38" rx="14" fill="#111a29"/>
  <path d="M2 26V16Q2 2 16 2H984Q998 2 998 16V40H2Z" fill="#111a29"/>
  <path d="M2 40H998" stroke="#243852"/>
  <circle cx="25" cy="21" r="5" fill="#ff625b"/><circle cx="43" cy="21" r="5" fill="#ffbd4a"/><circle cx="61" cy="21" r="5" fill="#45d483"/>
  <text x="500" y="25" text-anchor="middle" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="12" fill="#8fa8c4">santiago@cloud: ~/profile — zsh</text>
  <rect x="851" y="11" width="126" height="20" rx="10" fill="#0c2a2b" stroke="#1f6b67"/>
  <circle cx="864" cy="21" r="3" fill="#4de2b1" filter="url(#glow)"/><text x="875" y="25" font-family="JetBrains Mono, monospace" font-size="10" fill="#6fe9c4">SYSTEM ONLINE</text>
  <!-- Main terminal -->
  <text x="30" y="64" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="10" letter-spacing="2.5" fill="#5f7b9f">PROFILE INITIALIZATION</text>
  <path d="M30 72H680" stroke="#24466d" stroke-width="1"/>
  <g font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="16">
    <g clip-path="url(#line1)"><text x="30" y="104"><tspan fill="#50e3a4">$</tspan><tspan fill="#dce8f7"> ./profile.sh --mode=production</tspan></text></g>
    <g clip-path="url(#line2)"><text x="30" y="135"><tspan fill="#647d9b">› </tspan><tspan fill="#63c9ff">identity</tspan><tspan fill="#dce8f7">   = </tspan><tspan fill="#f2c879">Santiago Aldana</tspan></text></g>
    <g clip-path="url(#line3)"><text x="30" y="166"><tspan fill="#647d9b">› </tspan><tspan fill="#63c9ff">role</tspan><tspan fill="#dce8f7">       = </tspan><tspan fill="#f2c879">Cloud &amp; DevOps Engineer</tspan></text></g>
    <g clip-path="url(#line4)"><text x="30" y="197"><tspan fill="#647d9b">› </tspan><tspan fill="#63c9ff">toolchain</tspan><tspan fill="#dce8f7">  = </tspan><tspan fill="#f2c879">AWS · Terraform · CI/CD · Python</tspan></text></g>
    <g clip-path="url(#line5)"><text x="30" y="228"><tspan fill="#647d9b">› </tspan><tspan fill="#63c9ff">mission</tspan><tspan fill="#dce8f7">    = </tspan><tspan fill="#50e3a4">Automate infrastructure with AI</tspan></text></g>
  </g>
  <rect x="30" y="246" width="9" height="17" rx="1" fill="#43d9ff" filter="url(#glow)"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.48;.5;1" dur="1s" repeatCount="indefinite"/></rect>
  <text x="49" y="259" font-family="JetBrains Mono, monospace" font-size="10" fill="#6684a7">BUILD RELIABLE SYSTEMS. SHIP BETTER AUTOMATION.</text>
  <!-- Right status panel -->
  <rect x="713" y="57" width="259" height="205" rx="10" fill="url(#panel)" stroke="#24466d"/>
  <text x="734" y="79" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="2" fill="#7e9bbc">CAPABILITY MATRIX</text>
  <path d="M733 88H952" stroke="#203e60"/>
  <g font-family="JetBrains Mono, monospace" font-size="12">
    <text x="734" y="111" fill="#d7e6f7">AWS / CLOUD</text><rect x="845" y="101" width="105" height="5" rx="2.5" fill="#172b42"/><rect x="845" y="101" width="88" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="734" y="140" fill="#d7e6f7">INFRA AS CODE</text><rect x="845" y="130" width="105" height="5" rx="2.5" fill="#172b42"/><rect x="845" y="130" width="78" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="734" y="169" fill="#d7e6f7">CI / CD</text><rect x="845" y="159" width="105" height="5" rx="2.5" fill="#172b42"/><rect x="845" y="159" width="82" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="734" y="198" fill="#d7e6f7">AI AGENTS</text><rect x="845" y="188" width="105" height="5" rx="2.5" fill="#172b42"/><rect x="845" y="188" width="70" height="5" rx="2.5" fill="url(#accent)"/>
  </g>
  <rect x="733" y="216" width="219" height="29" rx="6" fill="#0c2531" stroke="#1e6573"/>
  <circle cx="749" cy="230" r="4" fill="#50e3a4" filter="url(#glow)"/>
  <text x="761" y="234" font-family="JetBrains Mono, monospace" font-size="10" fill="#85e9d0">OPEN TO REMOTE OPPORTUNITIES</text>
  <!-- Blue edge accents -->
  <path d="M14 58V43H29M971 282H986V267" fill="none" stroke="url(#accent)" stroke-width="2"/>
  <circle cx="684" cy="72" r="2" fill="#43d9ff"/><circle cx="694" cy="72" r="2" fill="#2f81f7"/><circle cx="704" cy="72" r="2" fill="#43d9ff"/>
</svg>
