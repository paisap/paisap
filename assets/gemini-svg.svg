<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Santiago Aldana — Cloud and DevOps Engineer</title>
  <desc id="d">Dark minimalist cyberpunk banner with active AI agent tool-calling MCP light pulses.</desc>

  <defs>
    <clipPath id="shape"><polygon points="0,0 960,0 1000,40 1000,300 40,300 0,260"/></clipPath>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060a"/><stop offset="1" stop-color="#0a0d16"/>
    </linearGradient>
    <radialGradient id="aura" cx="820" cy="140" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00e5ff" stop-opacity=".10"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="680" y2="0">
      <stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity=".03"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- typing reveal for the role line -->
    <clipPath id="type">
      <rect x="60" y="182" height="32" width="0">
        <animate attributeName="width" values="0;0;400;400;0" keyTimes="0;.06;.30;.92;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#shape)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#aura)"/>
    <rect width="1000" height="300" fill="url(#scan)"/>

    <!-- sweeping scanline -->
    <rect x="0" y="-10" width="1000" height="2" fill="#00e5ff" opacity=".08">
      <animate attributeName="y" values="-10;300" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- ============ LEFT: identity ============ -->
    <rect x="60" y="62" width="7" height="7" fill="#ff2e88"/>
    <text x="78" y="70" font-family="ui-monospace,'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="12" letter-spacing="2" fill="#00e5ff" opacity=".85" textLength="300" lengthAdjust="spacingAndGlyphs">// CLOUD · DEVOPS · AI AUTOMATION</text>

    <!-- name with brief chromatic glitch -->
    <g font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="58" font-weight="800">
      <text x="60" y="140" fill="#00e5ff" opacity=".8" textLength="590" lengthAdjust="spacingAndGlyphs">SANTIAGO ALDANA
        <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-4 0;3 -1;-2 1;0 0;0 0" keyTimes="0;.62;.64;.66;.68;.70;1" dur="7s" repeatCount="indefinite"/>
      </text>
      <text x="60" y="140" fill="#ff2e88" opacity=".8" textLength="590" lengthAdjust="spacingAndGlyphs">SANTIAGO ALDANA
        <animateTransform attributeName="transform" type="translate" values="0 0;0 0;4 0;-3 1;2 -1;0 0;0 0" keyTimes="0;.62;.64;.66;.68;.70;1" dur="7s" repeatCount="indefinite"/>
      </text>
      <text x="60" y="140" fill="#f2f5fa" textLength="590" lengthAdjust="spacingAndGlyphs">SANTIAGO ALDANA</text>
    </g>

    <line x1="60" y1="160" x2="680" y2="160" stroke="url(#rule)" stroke-width="1.5"/>
    <line x1="60" y1="160" x2="112" y2="160" stroke="#ff2e88" stroke-width="3"/>

    <!-- typed role -->
    <g clip-path="url(#type)">
      <text x="60" y="206" font-family="ui-monospace,'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="24" fill="#f2f5fa" textLength="400" lengthAdjust="spacingAndGlyphs"><tspan fill="#ff2e88">&gt;</tspan> Cloud &amp; DevOps Engineer</text>
    </g>
    <rect x="60" y="187" width="11" height="24" fill="#00e5ff" filter="url(#glow)">
      <animate attributeName="x" values="60;60;456;456;60" keyTimes="0;.06;.30;.92;1" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <text x="60" y="232" font-family="'Inter','Segoe UI',Arial,sans-serif" font-size="14" fill="#8b95a8" textLength="360" lengthAdjust="spacingAndGlyphs" opacity="0">Infrastructure as code. Agents that operate it.
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.30;.38;.92;1" dur="12s" repeatCount="indefinite"/>
    </text>

    <!-- chips -->
    <g font-family="ui-monospace,'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="11" fill="#c8d3e6">
      <g><rect x="60" y="250" width="53" height="24" fill="#0b0f18" stroke="#26324a"/><rect x="60" y="250" width="2" height="24" fill="#00e5ff"/>
         <text x="76" y="266" textLength="25" lengthAdjust="spacingAndGlyphs">AWS</text></g>
      <g><rect x="123" y="250" width="102" height="24" fill="#0b0f18" stroke="#26324a"/><rect x="123" y="250" width="2" height="24" fill="#00e5ff"/>
         <text x="139" y="266" textLength="74" lengthAdjust="spacingAndGlyphs">TERRAFORM</text></g>
      <g><rect x="235" y="250" width="85" height="24" fill="#0b0f18" stroke="#26324a"/><rect x="235" y="250" width="2" height="24" fill="#00e5ff"/>
         <text x="251" y="266" textLength="57" lengthAdjust="spacingAndGlyphs">ANSIBLE</text></g>
      <g><rect x="330" y="250" width="77" height="24" fill="#0b0f18" stroke="#26324a"/><rect x="330" y="250" width="2" height="24" fill="#00e5ff"/>
         <text x="346" y="266" textLength="49" lengthAdjust="spacingAndGlyphs">PYTHON</text></g>
      <g><rect x="417" y="250" width="102" height="24" fill="#0b0f18" stroke="#26324a"/><rect x="417" y="250" width="2" height="24" fill="#ff2e88"/>
         <text x="433" y="266" textLength="74" lengthAdjust="spacingAndGlyphs">LANGGRAPH</text></g>
    </g>

    <!-- ============ RIGHT: agent orchestrating AWS with MCP / Tool Calls ============ -->
    <circle cx="820" cy="140" r="125" fill="none" stroke="#1d2a44" stroke-width="1" stroke-dasharray="2 8">
      <animateTransform attributeName="transform" type="rotate" from="0 820 140" to="360 820 140" dur="90s" repeatCount="indefinite"/>
    </circle>

    <!-- hexagon -->
    <polygon points="820,50 898,95 898,185 820,230 742,185 742,95" fill="none" stroke="#00e5ff" stroke-opacity=".28"/>

    <!-- spokes -->
    <g stroke="#00e5ff" stroke-opacity=".16">
      <line x1="820" y1="140" x2="820" y2="50"/><line x1="820" y1="140" x2="898" y2="95"/>
      <line x1="820" y1="140" x2="898" y2="185"/><line x1="820" y1="140" x2="820" y2="230"/>
      <line x1="820" y1="140" x2="742" y2="185"/><line x1="820" y1="140" x2="742" y2="95"/>
    </g>

    <!-- active data flow dashes -->
    <g stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="3 7" fill="none">
      <line x1="820" y1="140" x2="820" y2="50"><animate attributeName="stroke-dashoffset" values="0;-20" dur="1.2s" repeatCount="indefinite"/></line>
      <line x1="820" y1="140" x2="898" y2="185"><animate attributeName="stroke-dashoffset" values="0;-20" dur="1.6s" repeatCount="indefinite"/></line>
      <line x1="820" y1="140" x2="742" y2="185"><animate attributeName="stroke-dashoffset" values="0;-20" dur="2s" repeatCount="indefinite"/></line>
    </g>

    <!-- ⚡ MCP / TOOL-CALLING GLOWING ORBS (Bolitas de luz viajando de ida y vuelta) -->
    <g>
      <!-- Orb to Lambda (Tool Execution) -->
      <circle r="3.5" fill="#00e5ff" filter="url(#glow)">
        <animate attributeName="cx" values="820;898;820" dur="1.8s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
        <animate attributeName="cy" values="140;95;140" dur="1.8s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/>
      </circle>

      <!-- Orb to EC2 (Infra Command) -->
      <circle r="3" fill="#ff2e88" filter="url(#glow)">
        <animate attributeName="cx" values="820;820;820" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="140;50;140" dur="1.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite"/>
      </circle>

      <!-- Orb to S3 (Data Fetching / Storage Tool) -->
      <circle r="3.5" fill="#00e5ff" filter="url(#glow)">
        <animate attributeName="cx" values="820;898;820" dur="2.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
        <animate attributeName="cy" values="140;185;140" dur="2.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/>
      </circle>

      <!-- Orb to RDS (Database Query Tool) -->
      <circle r="3" fill="#ff2e88" filter="url(#glow)">
        <animate attributeName="cx" values="820;742;820" dur="2.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
        <animate attributeName="cy" values="140;185;140" dur="2.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- nodes -->
    <g fill="#05060a" stroke="#00e5ff" stroke-width="1.5">
      <circle cx="820" cy="50" r="4.5"/><circle cx="898" cy="95" r="4.5"/><circle cx="898" cy="185" r="4.5"/>
      <circle cx="820" cy="230" r="4.5"/><circle cx="742" cy="185" r="4.5"/><circle cx="742" cy="95" r="4.5"/>
    </g>

    <!-- core agent -->
    <circle cx="820" cy="140" r="7" fill="#ff2e88" filter="url(#glow)"/>
    <circle cx="820" cy="140" r="7" fill="none" stroke="#ff2e88">
      <animate attributeName="r" values="7;24" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <!-- node labels -->
    <g font-family="ui-monospace,'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="9" letter-spacing="1" fill="#7e8ba3">
      <text x="820" y="38" text-anchor="middle">EC2</text>
      <text x="908" y="98">LAMBDA</text>
      <text x="908" y="188">S3</text>
      <text x="820" y="249" text-anchor="middle">EKS</text>
      <text x="732" y="188" text-anchor="end">RDS</text>
      <text x="732" y="98" text-anchor="end">IAM</text>
      <text x="834" y="143" fill="#ff2e88" letter-spacing="2">AGENT</text>
    </g>

    <!-- status -->
    <circle cx="752" cy="278" r="3" fill="#00e5ff" filter="url(#glow)">
      <animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="762" y="282" font-family="ui-monospace,'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="11" fill="#c8d3e6" textLength="178" lengthAdjust="spacingAndGlyphs">OPEN TO REMOTE ROLES</text>
  </g>

  <!-- sharp frame: cut corners, no rounded window -->
  <polygon points="0.75,0.75 960,0.75 999.25,40 999.25,299.25 40,299.25 0.75,260" fill="none" stroke="#1b2438" stroke-width="1.5"/>
  <path d="M0.75 30V0.75H30" fill="none" stroke="#00e5ff" stroke-width="2.5"/>
  <path d="M960 0.75L999.25 40" stroke="#ff2e88" stroke-width="2.5"/>
  <path d="M0.75 260L40 299.25" stroke="#ff2e88" stroke-width="2.5"/>
  <path d="M970 299.25H999.25V270" fill="none" stroke="#00e5ff" stroke-width="2.5"/>
</svg>
